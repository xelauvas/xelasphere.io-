<!-- app/templates/csrf_error.html -->
{% extends "base.html" %}

{% block content %}
<div style="max-width: 480px; margin: 80px auto; padding: 32px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; text-align: center;">
    <div style="font-size: 2rem; margin-bottom: 16px;">⚠️</div>
    <h2 style="font-size: 1.25rem; font-weight: 600; margin-bottom: 8px; color: #f0f0f0;">Security Error</h2>
    <p style="color: #aaa; margin-bottom: 16px;">{{ reason }}</p>
    <hr style="border: none; border-top: 1px solid rgba(255,255,255,0.08); margin: 16px 0;">
    <p style="color: #888; font-size: 0.875rem;">Please go back and try again.</p>
    <a href="/" style="display: inline-block; margin-top: 16px; padding: 8px 20px; background: rgba(255,255,255,0.08); color: #e0e0e0; border-radius: 8px; text-decoration: none; font-size: 0.875rem;">Go Home</a>
</div>
{% endblock %}
