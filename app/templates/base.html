<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Production-grade AI chat platform with 10+ model orchestration — Claude, GPT, Gemini, Grok & open-source. Artifacts, memory, web search, and file processing.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://xelasphere.com/">
    <meta property="og:title" content="XelaSphere — Multi-Model AI Chat Platform">
    <meta property="og:description" content="10+ AI models. Artifacts with versioning. Memory. Web search. File processing. Built for real work.">
    <meta property="og:image" content="https://xelasphere.com/static/images/og-image-v2.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="XelaSphere — Multi-Model AI Chat Platform">
    <meta name="twitter:description" content="10+ AI models. Artifacts with versioning. Memory. Web search. File processing.">
    <meta name="twitter:image" content="https://xelasphere.com/static/images/og-image-v2.png">
    <title>{% block title %}Xela{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='brand/xela-tile.svg') }}">
    <meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
    <!-- Theme first (light / dark / system), so the page never flashes the wrong colors -->
    <script src="{{ url_for('static', filename='js/themeManager.js') }}"></script>
    <!-- Responsive Foundation (load first) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive-foundation.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
    <!-- Xela skin: tokens + auth pages (must stay last) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/xela-claude.css') }}?v=1">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/xela-auth.css') }}?v=1">
</head>
<body class="bg-dark text-white">
    <!-- Main content -->
    {% block content %}{% endblock %}
    <!-- Bootstrap JS (Optional) -->
</body>
</html>
