positives:
  # openai_key (3 variants)
  - text: "api_key=sk-AAAAAAAAAAAAAAAAAAAA in config"
    redaction_marker: "[REDACTED:openai_key]"
  - text: "my token is sk-abcde12345FGHIJ67890pqrst"
    redaction_marker: "[REDACTED:openai_key]"
  - text: "prefix sk-XYZabc12345678901234pqrs suffix"
    redaction_marker: "[REDACTED:openai_key]"
  # anthropic_key (3 variants)
  - text: "Bearer sk-ant-api03-abcdef1234567890_-xyz"
    redaction_marker: "[REDACTED:anthropic_key]"
  - text: "config sk-ant-v2-abcdef1234567890-xyz end"
    redaction_marker: "[REDACTED:anthropic_key]"
  - text: "sk-ant-aaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    redaction_marker: "[REDACTED:anthropic_key]"
  # aws_access_key_id (3 variants)
  - text: "aws key AKIAIOSFODNN7EXAMPLE in env"
    redaction_marker: "[REDACTED:aws_access_key_id]"
  - text: "auth AKIA1234ABCD5678EFGH final"
    redaction_marker: "[REDACTED:aws_access_key_id]"
  - text: "AKIA0000000000000000"
    redaction_marker: "[REDACTED:aws_access_key_id]"
  # google_api_key (2 variants — 35 chars after AIza)
  - text: "gkey=AIzaabcdefghijklmnopqrstuvwxyz012345678"
    redaction_marker: "[REDACTED:google_api_key]"
  - text: "token AIzaSyDkW1234567890testkeyExampleGoogleApiK1234 end"
    redaction_marker: "[REDACTED:google_api_key]"
  # slack_bot_token (2 variants)
  - text: "token=xoxb-12345678-abcdefghijkl"
    redaction_marker: "[REDACTED:slack_bot_token]"
  - text: "slack xoxb-1234-56789-ABCDEFGHIJ ok"
    redaction_marker: "[REDACTED:slack_bot_token]"
  # github_pat (2 variants)
  - text: "ghp_AaBbCcDdEeFf1234567890xy"
    redaction_marker: "[REDACTED:github_pat]"
  - text: "token ghp_0000000000abcdefghij1234 ok"
    redaction_marker: "[REDACTED:github_pat]"
  # jwt (3 variants)
  - text: "jwt=eyJabcdef1234.eyJghijkl5678.sigabc123def"
    redaction_marker: "[REDACTED:jwt]"
  - text: "Bearer eyJhbGciOiJIUzI1NiI.eyJzdWIiOiIxMjM.SflKxwRJSMeKKF"
    redaction_marker: "[REDACTED:jwt]"
  - text: "eyJab_cdef_1234.eyJg-hij-kl56.sig-abc-123_def"
    redaction_marker: "[REDACTED:jwt]"
  # ssn_us (3 variants)
  - text: "SSN 123-45-6789 on file"
    redaction_marker: "[REDACTED:ssn]"
  - text: "in text 987-65-4321 appears"
    redaction_marker: "[REDACTED:ssn]"
  - text: "000-11-2222"
    redaction_marker: "[REDACTED:ssn]"
  # credit_card_luhn (3 variants — Luhn-valid test cards)
  - text: "card 4111111111111111 on file"
    redaction_marker: "[REDACTED:cc]"
  - text: "5555555555554444"
    redaction_marker: "[REDACTED:cc]"
  - text: "amex 378282246310005 for billing"
    redaction_marker: "[REDACTED:cc]"
  # extra coverage — long openai key
  - text: "long sk-abcdefghijklmnopqrstuvwxyzabcdefghij0123456789"
    redaction_marker: "[REDACTED:openai_key]"

