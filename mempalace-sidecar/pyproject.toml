[project]
name = "mempalace-sidecar"
version = "0.1.0"
description = "Sidecar wrapping mempalace for XelaSphere"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "aiorwlock>=1.4",
  "aiosqlite>=0.20",
  "prometheus-client>=0.21",
  "mempalace==3.3.1",
  "httpx>=0.27",
  "systemd-python>=235 ; platform_system=='Linux'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-forked>=1.6",
  "pytest-timeout>=2.3",
  "hypothesis>=6.112",
  "schemathesis>=3.36",
  "ruff>=0.6",
]

[project.scripts]
mempalace-sidecar = "mempalace_sidecar.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mempalace_sidecar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
  "integration: requires real Chroma + SQLite on tmp_path",
  "e2e: spawns real sidecar subprocess over UDS",
  "slow: > 1s",
]
addopts = "-v --tb=short -ra --timeout=60"
