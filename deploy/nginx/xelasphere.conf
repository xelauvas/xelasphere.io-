server {
    listen 80;
    server_name xelasphere.com www.xelasphere.com;
    return 301 https://xelasphere.com$request_uri;
}

server {
    listen 443 ssl;
    server_name xelasphere.com www.xelasphere.com;

    client_max_body_size 20M;

    ssl_certificate /etc/letsencrypt/live/xelasphere.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xelasphere.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Serve robots.txt directly to avoid hitting Flask
    location = /robots.txt {
        alias /root/xelas.io/xelasphere.io-/app/static/robots.txt;
    }

    # Block WordPress probes silently
    location ~* ^/(wp-admin|wp-login|wordpress) {
        return 444;
    }

    # Sandbox SSE streaming (long timeout, no buffering)
    location /api/sandbox/run {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
    }

    # Sandbox app proxy
    location /api/sandbox/proxy/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    # Sandbox VNC — proxy to container's noVNC port (dynamic)
    location ~ ^/sandbox-vnc/(\d+)/(.*) {
        resolver 127.0.0.53 valid=5s;
        set $vnc_port $1;
        set $vnc_path $2;
        proxy_pass http://127.0.0.1:$vnc_port/$vnc_path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Increase timeouts for AI API streaming responses
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;

        # SSE streaming support
        proxy_buffering off;
        proxy_cache off;
    }
}
