# api.xelasphere.com — Xela model API (OpenAI-compatible) + Xela Code sign-in.
#
#   /v1/*   -> model server on 127.0.0.1:11434 (reverse SSH tunnel from the GPU machine, `xela-link`),
#              after nginx validates the client's Bearer key with the app (auth_request -> /api/cli/verify)
#   /props  -> same, read-only server info (context size) for the CLI
#   /cli/*  -> the app's /api/cli/* (device-code sign-in, token, me)
#
# __LLAMA_KEY__ is replaced at install time with the llama-server --api-key (see deploy/XELA-CODE-LINK.md).

server {
    listen 80;
    server_name api.xelasphere.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.xelasphere.com;

    ssl_certificate /etc/letsencrypt/live/api.xelasphere.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.xelasphere.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 20m;   # long prompts (64k-token contexts)

    location /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location = / {
        default_type application/json;
        return 200 '{"name":"XelaSphere API","version":"v1","endpoints":["/v1/chat/completions","/v1/models","/cli/device","/cli/token","/cli/me","/health"],"signin":"xela-local --login"}';
    }

    # Xela Code sign-in (device flow) and key info — served by the Flask app
    location /cli/ {
        proxy_pass http://127.0.0.1:5000/api/cli/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    # Internal: validate the client's API key with the app (nginx auth_request)
    location = /_xela_auth {
        internal;
        proxy_pass http://127.0.0.1:5000/api/cli/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Original-URI $request_uri;
        proxy_read_timeout 10s;
    }

    location /v1 {
        auth_request /_xela_auth;
        auth_request_set $xela_user $upstream_http_x_xela_user;
        error_page 401 = @unauthorized;
        error_page 502 504 = @offline;

        proxy_pass http://127.0.0.1:11434;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Xela-User $xela_user;
        proxy_set_header Authorization "Bearer __LLAMA_KEY__";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location = /props {
        auth_request /_xela_auth;
        error_page 401 = @unauthorized;
        error_page 502 504 = @offline;

        proxy_pass http://127.0.0.1:11434/props;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header Authorization "Bearer __LLAMA_KEY__";
        proxy_set_header Connection "";
    }

    location @unauthorized {
        default_type application/json;
        return 401 '{"error":{"message":"Incorrect API key provided. Run `xela-local --login` to sign in with your XelaSphere account.","type":"invalid_request_error","code":"invalid_api_key"}}';
    }

    location @offline {
        default_type application/json;
        return 503 '{"error":{"message":"The Xela model server is offline (the GPU machine is not connected). Try again later.","type":"server_error","code":"model_offline"}}';
    }
}
