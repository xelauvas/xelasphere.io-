# Mempalace recall-bench rubric — automated per-persona retrieval quality.
#
# Built 2026-04-29 to substitute for the calendar-floor P2 weekly rubric
# under solo-traffic conditions where the weekly rubric is statistically
# meaningless (see spec §7.4 amendment, phase-log P1.x).
#
# Each persona's recall_queries are matched against shadow JSONL records;
# tier-by-tier hit rates are computed against the `truth` substring (case-
# insensitive). crosstopic_queries score how MUCH project context bleeds
# in (lower = better — ideal is 0/N).
#
# Pass criterion (overall, per persona):
#   - recall_l2_or_l3 >= 0.80 (eighty percent of recall queries find the
#     truth in either the topic or semantic tier)
#   - crosstopic_l2_l3_avg <= 0.40 (semantic + topic tiers should not
#     overwhelmingly return project context on off-topic queries)

personas:

  marcus:
    user_id: "rRThYRtGkIW93Jv9PnPDhKGC7G73"
    description: "Marathoner training for Boston 2027"
    recall_queries:
      - {query: "A-race target time again", truth: "sub-3:00",     label: "target time"}
      - {query: "foot issue I've been dealing", truth: "plantar",  label: "foot issue"}
      - {query: "who's my coach",          truth: "Jenny",          label: "coach name"}
      - {query: "Saturday long-run time change", truth: "8am",     label: "long-run pivot"}
    crosstopic_queries:
      - {query: "non-fiction book",        label: "book rec"}
      - {query: "coffee shop in NYC",      label: "NYC coffee"}
    project_keywords:
      - marcus
      - asheville
      - boston
      - marathon
      - jenny
      - hadfield
      - plantar
      - elena
      - "er physician"
      - sub-3
      - "sub 3"
      - peak
      - "low-carb"
      - altitude
      - "black mountain"
      - "strength training"

